name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore CompressionSystem.Tests/CompressionSystem.Tests.csproj
      - name: Build
        run: dotnet build CompressionSystem.Tests/CompressionSystem.Tests.csproj --no-restore
      - name: Test
        run: dotnet test CompressionSystem.Tests/CompressionSystem.Tests.csproj --no-build